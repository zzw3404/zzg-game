<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>余烬誓约 · Ember Oath</title>
<link rel="icon" type="image/svg+xml" href="/assets/ui/ember-crest.svg">
<meta name="description" content="余烬誓约 — 实时动作冒险，西幻风格界面。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
 :root{--bg:#090d12;--ink:#e9deca;--gold:#d7b779;color-scheme:dark}
 html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
 canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
 #hud{position:fixed;inset:0;pointer-events:none;z-index:1;font-family:'Noto Serif SC','Microsoft YaHei',serif;color:var(--ink)}
 #load{position:fixed;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,#20252d 0%,var(--bg) 68%);transition:opacity 1s ease}
 #load.done{opacity:0}#load:before{content:'';position:absolute;inset:22px;border:1px solid #c5aa7330;pointer-events:none}
 #load .wrap{display:grid;justify-items:center;gap:16px;transform:translateY(-2vh);width:min(420px,78vw);text-align:center}
 #load .emblem{width:84px;height:96px;filter:drop-shadow(0 0 24px #c9953b22);margin-bottom:4px}
 #load .title{font:600 clamp(38px,8vw,57px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.09em;color:#eedec0}
 #load .sub{font:500 clamp(20px,4vw,27px)/1.5 'Noto Serif SC','Microsoft YaHei',serif;letter-spacing:.35em;padding-left:.35em;color:#ccb180}
 #load .motto{font:11px/1.5 'Noto Serif SC',serif;color:#8d8373;letter-spacing:.09em;margin:4px 0 9px}
 #load .progress{width:100%;height:16px;overflow:visible}
 #load .track{fill:none;stroke:#bda06a24;stroke-width:2}
 #load .stroke{fill:none;stroke:#d7b779;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:.985;transition:stroke-dashoffset .5s ease}
 #load .label{font:11px/1.5 'Noto Serif SC','Microsoft YaHei',serif;letter-spacing:.12em;min-height:17px;color:#a7977e}
 #load .folio{position:absolute;bottom:40px;font:10px/1 Georgia,serif;letter-spacing:.24em;color:#8e7c5b88}
 @media(prefers-reduced-motion:reduce){#load,#load .stroke{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="游戏画面"></canvas><div id="hud"></div>
<div id="load" role="status" aria-label="正在加载游戏"><div class="wrap">
 <img class="emblem" src="/assets/ui/ember-crest.svg" alt="火焰盾徽">
 <div class="title">EMBER OATH</div><div class="sub">余烬誓约</div>
 <div class="motto">以余烬为证，向黑暗前行。</div>
 <svg class="progress" viewBox="0 0 360 16" aria-hidden="true"><path class="track" d="M5 8H355"/><path id="stroke" class="stroke" pathLength="1" d="M5 8H355"/><path d="m0 8 4-4 4 4-4 4Zm352 0 4-4 4 4-4 4Z" fill="#d7b779"/></svg>
 <div class="label" id="loadLabel">正在准备冒险</div>
</div><div class="folio">REAL-TIME ACTION RPG</div></div>
<script>
 window.__load=function(p,label){
  var e=document.getElementById('stroke');if(!e)return;
  e.style.strokeDashoffset=String(1-Math.max(.015,Math.min(1,p)));
  if(label!==undefined){
   var l=document.getElementById('loadLabel');
   var stages={sky:'准备天空与光照',earth:'构建地形',terrain:'构建地形',mountains:'生成远景',stone:'准备石材',wind:'准备环境',grass:'铺设植被',flowers:'准备植被',tree:'准备植被',trees:'准备植被',bamboo:'准备植被',street:'准备区域',town:'准备区域',motes:'准备环境效果',sound:'准备音效',sword:'准备角色与装备',characters:'准备角色与装备',shops:'准备商店',hollow:'准备圣堂'};
   var key=String(label).split('·').pop().trim().toLowerCase();
   if(l)l.textContent=stages[key]||(label?String(label):'即将抵达');
  }
 };
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
